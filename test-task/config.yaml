---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-task-deployment
  labels:
    app: debug-task-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debug-task-app
  template:
    metadata:
      labels:
        app: debug-task-app
    spec:
      containers:       
        - name: app
          # Image has been build under amd64
          # Better to use the versioning system instaed of 'latest' tag. 
          # image: alpacked/test-task 
          # imagePullPolicy: Always
          
          image: alpacked/test-task-build:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app-storage
              mountPath: /app/data
            - name: debug-task
              mountPath: /app/uploads

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: debug-task
          persistentVolumeClaim:
            claimName: debug-task-pvc
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: debug-task-app
data:
  default.conf: |
    server {
        listen 80;

        # It is beeter to implemet /health as a separate endpoint
        location /health {
            access_log off;   # turn off logs to avoid spam
            
            proxy_pass http://debug-task-service.default.svc.cluster.local:8080/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://debug-task-service.default.svc.cluster.local:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: debug-task-service
spec:
  selector:
    app: debug-task-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: debug-task-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/uploads # hostPath could not be used in the cluster that has more then one node.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-storage-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data # hostPath could not be used in the cluster that has more then one node.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: debug-task-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Add PVC for app-storage data in /app/data/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-storage-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
